<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Учебный час</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="header__logo" href="index.html"><img class="header__logo-image" src="img/logo.svg" alt="Логотип">Учебный час</a>
            <nav class="header__nav">
                <a class="header__link" href="index.html">Главная</a>
                <a class="header__link" href="register.html">Регистрация</a>
                <a class="header__link header__link--active" href="login.html">Вход</a>
                <a class="header__link" href="orders.html">Мои заявки</a>
                <a class="header__link" href="create.html">Новая заявка</a>
                <a class="header__link" href="admin.html">Администратор</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <section class="form-page">
            <div class="container">
                <div class="form-page__card">
                    <div class="form-page__heading">
                        <h1 class="form-page__title">Вход в аккаунт</h1>
                        <p class="form-page__text">Введите логин и пароль, чтобы продолжить</p>
                    </div>
                    <form class="form" action="" method="post">
                        <div class="form__group"><label class="form__label" for="login">Логин *</label><input
                                class="form__input" id="login" name="login" type="text" placeholder="ivan123" required>
                        </div>
                        <div class="form__group"><label class="form__label" for="login_password">Пароль *</label><input
                                class="form__input" id="login_password" name="login_password" type="password"
                                placeholder="Введите пароль" required></div><button class="button form__submit"
                            type="submit">Войти</button>
                    </form>
                    <p class="form__error">Неверный логин или пароль</p>
                    <p class="form-page__bottom">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container footer__inner">
            <div class="footer__brand"><img class="footer__image" src="img/logo.svg" alt="Логотип">
                <div><b>Учебный час</b>
                    <p>Курсы по школьным предметам</p>
                </div>
            </div>
            <div class="footer__contacts">
                <p>+7 (900) 123-45-67</p>
                <p>info@uchebny-chas.ru</p>
                <p>© 2026 Учебный час</p>
            </div>
        </div>
    </footer>
</body>
</html>
